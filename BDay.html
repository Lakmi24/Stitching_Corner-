<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Stitching Corner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #fffaf5;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    .header {
      background-color: #d97757;
      color: white;
      padding: 20px;
    }

    .notes {
      font-size: 14px;
      color: #fff;
    }

    .carousel {
      position: relative;
      width: 90%;
      max-width: 1000px;
      aspect-ratio: 16 / 9;
      /* ok if supported */
      min-height: 300px;
      /* fallback if aspect-ratio isn't supported */
      margin: 10px auto;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    .slides {
      height: 100%;
      /* ensure slides fills the carousel */
    }

    .slides img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      /* center the cropped area */
      display: none;
      border-radius: 10px;
    }

    .prev,
    .next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background-color: rgba(0, 0, 0, 0.5);
      color: white;
      border: none;
      border-radius: 50%;
      padding: 10px 15px;
      cursor: pointer;
      font-size: 18px;
    }

    .prev:hover,
    .next:hover {
      background-color: rgba(0, 0, 0, 0.7);
    }

    .prev {
      left: 10px;
    }

    .next {
      right: 10px;
    }
  </style>
</head>

<body>

  <header class="header">
    <div style="display: flex; justify-content: flex-end;">
      <a href="Categories.html">Categories</a>
    </div>
    <h1>Birthday Gifts</h1>
    <p class="notes">Welcome to Our Unique Handmade Gifts For Your Loved Ones</p>
  </header>
  <section class="carousel">
    <div class="slides">
      <img src="pictures/BDay/new14.jpg" alt="Slide 1" class="active">
      <img src="pictures/BDay/new15.jpg" alt="Slide 2">
      <img src="pictures/BDay/new16.jpg" alt="Slide 3">
    </div>
    <button class="prev">&#10094;</button>
    <button class="next">&#10095;</button>
  </section>

  <script>
    const slides = document.querySelectorAll('.slides img');
    const prev = document.querySelector('.prev');
    const next = document.querySelector('.next');
    let index = 0;

    function showSlide(i) {
      slides.forEach((slide, idx) => {
        slide.classList.toggle('active', idx === i);
      });
    }

    prev.addEventListener('click', () => {
      index = (index > 0) ? index - 1 : slides.length - 1;
      showSlide(index);
    });

    next.addEventListener('click', () => {
      index = (index < slides.length - 1) ? index + 1 : 0;
      showSlide(index);
    });
  </script>
</body>

</html>
